name: Build & Release Sonora APK

on:
  push:
    branches:
      - "main"
    paths:
      - "app/build.gradle.kts"
  tags:
    - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine release version
        id: check
        run: |
          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --console=plain :innertube:testDebugUnitTest :app:testFossDebugUnitTest --warning-mode summary

      - name: Decode release keystore (if configured)
        if: ${{ secrets.KEYSTORE != '' }}
        run: |
          mkdir -p app/keystore
          printf '%s' "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore

      - name: Build Sonora APK
        env:
          SONORA_APPLICATION_ID: com.sonora.music
          SONORA_APP_NAME: Sonora
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -s app/keystore/release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
          else
            ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -rf app/keystore

      - name: Prepare APK artifact
        run: |
          mkdir -p release_files
          RELEASE_APK=$(find app/build/outputs/apk/foss/release -maxdepth 1 -name "*.apk" ! -name "*-unsigned.apk" 2>/dev/null | head -1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "release_files/Sonora.apk"
          else
            DEBUG_APK=$(find app/build/outputs/apk/foss/debug -maxdepth 1 -name "*.apk" | head -1)
            cp "$DEBUG_APK" "release_files/Sonora.apk"
          fi
          ls -lh release_files/

      - name: Generate release notes
        run: |
          {
            echo "Sonora v${{ needs.check-version.outputs.version }}"
            echo ""
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -20
            else
              git log -n 15 --pretty=format:"- %s" --no-merges
            fi
          } > release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.check-version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/Sonora.apk --clobber
            gh release edit "$TAG" \
              --title "Sonora $TAG" \
              --notes-file release_notes.md \
              --latest
          else
            gh release create "$TAG" \
              --title "Sonora $TAG" \
              --notes-file release_notes.md \
              --latest \
              release_files/Sonora.apk
          fi
